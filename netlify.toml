# Netlify 설정 파일

[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["glpk.js"] # glpk.js를 외부 모듈로 처리
  # 'updatePrices' 함수를 1분마다 실행하도록 설정
  [functions."updatePrices"]
    schedule = "* * * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://developer-lostark.game.onstove.com https://*.upstash.io; font-src 'self' data:; object-src 'none'; base-uri 'self';"
